_schema-version: 3.3.0
ID: rental-equipment-tracker
version: 1.0.0
description: "Rental Equipment Tracking & Condition Logging with Automated Repair Billing (SAP CAP + Fiori + SAP HANA Cloud)"

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/copyUi.js

modules:
  # CAP service (OData v4 for Fiori, REST for the yard app)
  - name: rental-equipment-tracker-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 1024M
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: rental-equipment-tracker-auth
      - name: rental-equipment-tracker-db
      - name: rental-equipment-tracker-destination
      # - name: cloudinary-credentials        # optional: photo copies in Cloudinary (see README)

  # SAP HANA Cloud: deploys the CDS model into the HDI container
  - name: rental-equipment-tracker-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: rental-equipment-tracker-db

  # Application router: login (XSUAA) and routing to the CAP service
  - name: rental-equipment-tracker
    type: approuter.nodejs
    path: .deploy/app-router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      - name: rental-equipment-tracker-auth
      - name: rental-equipment-tracker-html5-runtime

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: rental-equipment-tracker-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: rental-equipment-tracker-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: rental-equipment-tracker-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # Destinations HANA_DEV / HANA_QAS / HANA_PROD to the S/4HANA backend (INT-01 ... INT-08)
  - name: rental-equipment-tracker-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: rental-equipment-tracker-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: rental-equipment-tracker-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # Cloudinary User Provided Service (optional, create it first: see README)
  # - name: cloudinary-credentials
  #   type: org.cloudfoundry.existing-service
